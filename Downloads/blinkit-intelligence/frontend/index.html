<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinkit Price Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">B</div>
      <span class="logo-text">BlinkIQ</span>
    </div>
    <nav>
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </button>
      <button class="nav-item" data-view="lookup">
        <span class="nav-icon">⊙</span> Product Lookup
      </button>
      <button class="nav-item" data-view="category">
        <span class="nav-icon">⊞</span> Category Browse
      </button>
      <button class="nav-item" data-view="search">
        <span class="nav-icon">⊘</span> Keyword Search
      </button>
      <button class="nav-item" data-view="tracked">
        <span class="nav-icon">◉</span> Tracked Products
      </button>
      <button class="nav-item" data-view="alerts">
        <span class="nav-icon">◎</span> Alerts
      </button>
      <button class="nav-item" data-view="zipcodes">
        <span class="nav-icon">⊕</span> Zipcodes
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="api-status" id="api-status">
        <span class="status-dot"></span> Connecting...
      </div>
    </div>
  </aside>

  <main class="main">

    <!-- DASHBOARD -->
    <div class="view active" id="view-dashboard">
      <div class="view-header">
        <h2>Dashboard</h2>
        <button class="btn" onclick="loadDashboard()">↻ Refresh</button>
      </div>
      <div class="stat-grid" id="dash-stats">
        <div class="stat-card"><div class="stat-label">Tracked Products</div><div class="stat-value" id="stat-products">—</div></div>
        <div class="stat-card"><div class="stat-label">Active Zipcodes</div><div class="stat-value" id="stat-zipcodes">—</div></div>
        <div class="stat-card"><div class="stat-label">Alerts Today</div><div class="stat-value" id="stat-alerts">—</div></div>
        <div class="stat-card"><div class="stat-label">Price Drops</div><div class="stat-value green" id="stat-drops">—</div></div>
      </div>
      <div class="section-title">Recent Alerts</div>
      <div id="dash-alerts"></div>
    </div>

    <!-- PRODUCT LOOKUP -->
    <div class="view" id="view-lookup">
      <div class="view-header"><h2>Product Lookup</h2></div>
      <div class="form-card">
        <div class="form-row">
          <div class="field"><label>Product ID</label><input id="l-pid" placeholder="e.g. 467332" value="467332"></div>
          <div class="field"><label>Zipcode</label><input id="l-zip" placeholder="e.g. 380015" value="380015"></div>
          <button class="btn primary" onclick="lookupProduct()">Fetch</button>
          <button class="btn success" onclick="trackProduct()" id="track-btn" style="display:none">+ Track</button>
        </div>
      </div>
      <div id="lookup-result"></div>
    </div>

    <!-- CATEGORY -->
    <div class="view" id="view-category">
      <div class="view-header"><h2>Category Browse</h2></div>
      <div class="form-card">
        <div class="form-row">
          <div class="field"><label>Category ID</label><input id="c-catid" placeholder="e.g. 1295" value="1295"></div>
          <div class="field"><label>Zipcode</label><input id="c-zip" placeholder="e.g. 380015" value="380015"></div>
          <button class="btn primary" onclick="browseCategory(true)">Browse</button>
        </div>
      </div>
      <div id="cat-result"></div>
      <div id="cat-pg" style="display:none;margin-top:1rem;display:none">
        <button class="btn" onclick="browseCategory(false)">Load More</button>
        <span id="cat-count" class="count-label"></span>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="view" id="view-search">
      <div class="view-header"><h2>Keyword Search</h2></div>
      <div class="form-card">
        <div class="form-row">
          <div class="field"><label>Keyword</label><input id="s-kw" placeholder="e.g. milk, chips, cake" value="milk"></div>
          <div class="field"><label>Zipcode</label><input id="s-zip" placeholder="e.g. 380015" value="380015"></div>
          <button class="btn primary" onclick="doSearch(true)">Search</button>
        </div>
      </div>
      <div id="search-result"></div>
      <div id="search-pg" style="display:none">
        <button class="btn" onclick="doSearch(false)">Load More</button>
        <span id="search-count" class="count-label"></span>
      </div>
    </div>

    <!-- TRACKED -->
    <div class="view" id="view-tracked">
      <div class="view-header">
        <h2>Tracked Products</h2>
        <button class="btn" onclick="loadTracked()">↻ Refresh</button>
      </div>
      <div id="tracked-result"></div>
    </div>

    <!-- ALERTS -->
    <div class="view" id="view-alerts">
      <div class="view-header">
        <h2>Price Alerts</h2>
        <button class="btn" onclick="loadAlerts()">↻ Refresh</button>
      </div>
      <div id="alerts-result"></div>
    </div>

    <!-- ZIPCODES -->
    <div class="view" id="view-zipcodes">
      <div class="view-header"><h2>Tracked Zipcodes</h2></div>
      <div class="form-card">
        <div class="form-row">
          <div class="field"><label>Zipcode</label><input id="z-zip" placeholder="e.g. 600001"></div>
          <div class="field"><label>City</label><input id="z-city" placeholder="Chennai"></div>
          <div class="field"><label>State</label><input id="z-state" placeholder="Tamil Nadu"></div>
          <button class="btn primary" onclick="addZipcode()">Add</button>
        </div>
      </div>
      <div id="zipcodes-result"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
